<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Pages & Lattes</title>

  <!-- Bootstrap 5 CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Custom CSS to match the storefront look -->
  <style>
    :root {
      --accent: rgb(164, 92, 109);
      --accent-dark: #7c3f4f;
      --bg-pink: #fdf1f2;
    }

    body {
      background-color: var(--bg-pink);
      font-family: Georgia, 'Times New Roman', serif;
      color: #333;
    }

    header {
      background-color: #ffffff;
      border-bottom: 1px solid #eadade;
    }

    header nav a {
      color: var(--accent-dark);
      text-decoration: none;
      font-weight: 600;
      margin: 0 12px;
    }

    header nav a:hover {
      text-decoration: underline;
    }

    .site-title {
      color: var(--accent);
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .signup-card {
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(164, 92, 109, 0.15);
      padding: 2.5rem;
      max-width: 480px;
      margin: 3rem auto;
    }

    .signup-card h2 {
      color: var(--accent);
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .btn-brand {
      background-color: var(--accent);
      border: none;
      color: #fff;
    }

    .btn-brand:hover {
      background-color: var(--accent-dark);
      color: #fff;
    }

    footer {
      background-color: #ffffff;
      border-top: 1px solid #eadade;
      text-align: center;
      padding: 1.5rem 0;
      margin-top: 3rem;
      color: #555;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Header / Navigation (matches storefront.html) -->
  <header class="py-3">
    <div class="container d-flex justify-content-between align-items-center flex-wrap">
      <h1 class="site-title h3 m-0">Pages & Lattes</h1>
      <nav class="mt-2 mt-md-0">
        <a href="index.html#books">Books</a>
        <a href="index.html#hours">Hours</a>
        <a href="index.html#contact">Contact</a>
        <a href="signup.html">Sign Up</a>
      </nav>
    </div>
  </header>

  <!-- Main content: Sign Up form -->
  <main class="container">
    <div class="signup-card">
      <h2>Create Your Account</h2>
      <form>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            placeholder="Enter a username"
            required
          />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Enter a password"
            required
          />
        </div>

        <div class="mb-4">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input
            type="password"
            class="form-control"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Re-enter your password"
            required
          />
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-brand btn-lg">Sign Up</button>
        </div>

        <p class="text-center mt-3 mb-0">
          Already have an account? <a href="index.html" style="color: var(--accent);">Return to storefront</a>
        </p>
      </form>
    </div>
  </main>

  <!-- Footer (matches storefront.html) -->
  <footer>
    <p class="m-0">Open Daily: 7:00 AM – 8:00 PM</p>
    <p class="m-0">123 Chapter Lane, Booktown | (555) 123-4567</p>
    <p class="m-0">&copy; 2026 Pages & Lattes</p>
  </footer>

  <!-- Bootstrap JS Bundle (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
